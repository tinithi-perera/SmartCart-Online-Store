<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SmartCart Online Store</title>
</head>

<body bgcolor="#eccc68">
    <nav>
        <a href="index.html">Home</a>|
        <a href="products.html">Products</a>|
        <a href="about.html">About us</a>|
        <a href="contact.html">Contact us</a>
    </nav>
    <h1>Contact Us</h1>
    <form>
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname">
        <br><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
        <br><br>
        <label for="productcategory">Product Category:</label>
        <select id="productcategory" name="productcategory">
            <option value="Electronics">Electronics</option>
            <option value="Accessories">Accessories</option>
            <option value="Computers">Computers</option>
            <option value="Mobile devices">Mobile Devices</option>
        </select>
            <br><br>
        <label for="Areasinterest">Areas of Interest:</label>
        <input type="checkbox" id="New Products" name="interest" value="newproducts">
        <label for="New Products">New Products</label>
        <input type="checkbox" id="Special Offers" name="interest" value="specialoffers">
        <label for="Special Offers">Special Offers</label>
        <input type="checkbox" id="Computer Accessories" name="interest" value="computeraccessories">
        <label for="Computer Accessories">Computer Accessories</label>
        <input type="checkbox" id="Mobile Accessories" name="interest" value="mobileaccessories">
        <label for="Mobile Accessories">Mobile Accessories</label>

        <br><br>
        <label for="message">Message:</label><br>
        
        <textarea id="message" name="message" rows="5" cols="40"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>

</html>
